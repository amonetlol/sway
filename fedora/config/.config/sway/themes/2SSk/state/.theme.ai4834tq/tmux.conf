# Generated by theme_render.py (nord dark); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
set -g status-style "fg=#979da9 bg=default"
set -g status-left "#[fg=#d8dee9 bold]#S#{?client_prefix,#[fg=#88c0d0] ●,}"
set -g status-right "#[fg=#979da9]#h"
set -g window-status-format "#[fg=#979da9]#I:#W"
set -g window-status-current-format "#[fg=#88c0d0 bold]#I:#W"
setw -g window-status-activity-style "fg=#ebcb8b"
setw -g window-status-bell-style "fg=#ebcb8b bold"
set -g message-style "fg=#2e3440 bg=#88c0d0"
set -g message-command-style "fg=#2e3440 bg=#ebcb8b"
set -g mode-style "fg=#d8dee9 bg=#434c5e"
set -g pane-border-style "fg=#434c5e"
set -g pane-active-border-style "fg=#88c0d0"
set -g popup-border-style "fg=#88c0d0"
set -g display-panes-colour "#979da9"
set -g display-panes-active-colour "#88c0d0"
set -g clock-mode-colour "#88c0d0"
