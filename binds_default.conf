# Common app shortcuts, matching the Hyprland profile.
bindsym $mod+Return exec $terminal
bindsym $mod+w exec firefox
bindsym $mod+e exec $file_manager --new-window
bindsym $mod+q kill
bindsym $mod+d exec $scripts/launcher.sh
bindsym $mod+space exec $scripts/launcher.sh
bindsym $mod+m exec @@HOME@@/.local/bin/mon --sway
bindsym $mod+x exec $scripts/power-menu.sh
bindsym $mod+period exec $terminal -e nvim $sway_root
bindsym $mod+h exec $terminal -e nvim $sway_root/config $sway_root/binds_default.conf
bindsym $mod+F1 exec $scripts/desktop.py keybinds
bindsym $mod+slash exec $scripts/desktop.py keybinds
bindsym $mod+v exec $scripts/clipboard.sh
bindsym $mod+Ctrl+p exec $scripts/screenshot.sh menu
bindsym $mod+Shift+t exec $scripts/set_theme.sh
# Manual locking only.
bindsym $mod+Ctrl+Shift+l exec swaylock -C $sway_root/current/swaylock/config
bindsym Print exec $scripts/screenshot.sh full
bindsym $mod+Print exec $scripts/screenshot.sh area
bindsym $mod+Shift+Print exec $scripts/screenshot.sh window
bindsym Ctrl+Print exec $scripts/screenshot.sh full-clipboard
bindsym Ctrl+$mod+Print exec $scripts/screenshot.sh area-clipboard
bindsym Ctrl+Alt+Print exec $scripts/screenshot.sh window-clipboard
# Native Sway window management.
bindsym $mod+t floating toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+f fullscreen toggle
bindsym $mod+j split toggle
bindsym $mod+semicolon layout toggle splith splitv tabbed stacking
bindsym $mod+BackSpace resize set width 50 ppt height 50 ppt
bindsym $mod+Tab workspace back_and_forth
bindsym Alt+Tab focus next
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Ctrl+h workspace prev
bindsym $mod+Ctrl+l workspace next
bindsym $mod+s scratchpad show
bindsym $mod+Shift+s move scratchpad
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl play-pause
bindsym $mod+Left focus left
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Ctrl+Left move left 30 px
bindsym $mod+Right focus right
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Ctrl+Right move right 30 px
bindsym $mod+Up focus up
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Ctrl+Up move up 30 px
bindsym $mod+Down focus down
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Ctrl+Down move down 30 px
bindsym $mod+Alt+h resize shrink width 30 px
bindsym $mod+Alt+l resize grow width 30 px
bindsym $mod+Alt+k resize shrink height 30 px
bindsym $mod+Alt+j resize grow height 30 px
bindsym $mod+1 workspace number 1
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+0 move container to workspace number 10
