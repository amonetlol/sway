# Common Sway application and workspace bindings remain available.
unbindsym $mod+h
bindsym $mod+h exec @@HOME@@/.config/sway/themes/DarkShadow/scripts/toggle-panel.sh settings
bindsym $mod+F10 exec @@HOME@@/.config/sway/themes/DarkShadow/scripts/toggle-panel.sh wallpaper
unbindsym $mod+d
bindsym $mod+d exec @@HOME@@/.config/sway/themes/DarkShadow/runtime/bin/rice-launch
unbindsym $mod+space
bindsym $mod+space exec @@HOME@@/.config/sway/themes/DarkShadow/runtime/bin/rice-launch
unbindsym $mod+x
bindsym $mod+x exec @@HOME@@/.config/sway/themes/DarkShadow/runtime/bin/rice-power
