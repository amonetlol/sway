# Only additional bindings for this theme; common app bindings are preserved.
bindsym $mod+i exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh settings toggle
bindsym $mod+c exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh control toggle
bindsym $mod+n exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh notifications toggle
bindsym $mod+F10 exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh wallpaper toggle

# Native 2SSk launcher (Apps / Emoji / Files / Themes).
unbindsym $mod+h
bindsym $mod+h exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh settings toggle
unbindsym $mod+d
bindsym $mod+d exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh launcher toggle apps
unbindsym $mod+space
bindsym $mod+space exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh launcher toggle apps
bindsym $mod+Shift+d exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh launcher toggle themes

unbindsym $mod+x
bindsym $mod+x exec @@HOME@@/.config/sway/themes/2SSk/scripts/ipc.sh power toggle
