# Generated by theme_render.py (nord dark); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#88c0d0","#ebcb8b","#81a1c1","#d08770","#a3be8c","#bf616a"
[color "branch"]
	current = "#81a1c1 bold"
	local = "#d8dee9"
	remote = "#ebcb8b"
	upstream = "#a3be8c"
	plain = "#88c0d0"
[color "decorate"]
	HEAD = "#bf616a bold"
	branch = "#88c0d0"
	tag = "#ebcb8b"
	remoteBranch = "#81a1c1"
[color "diff"]
	meta = "#979da9 bold"
	frag = "#81a1c1"
	context = "#d8dee9"
	old = "#bf616a"
	new = "#a3be8c"
	whitespace = "#ebcb8b reverse"
[color "status"]
	branch = "#88c0d0 bold"
	added = "#a3be8c"
	changed = "#ebcb8b"
	untracked = "#bf616a"
[color "blame"]
	highlightRecent = "#979da9",1 month ago,"#d8dee9",7 days ago,"#88c0d0"
[delta]
	file-style = "#88c0d0" bold
	file-decoration-style = "#434c5e" ul
	hunk-header-style = "#81a1c1"
	hunk-header-decoration-style = "#434c5e" box
	minus-style = "#bf616a"
	minus-emph-style = "#2e3440" "#bf616a"
	plus-style = "#a3be8c"
	plus-emph-style = "#2e3440" "#a3be8c"
	line-numbers-minus-style = "#bf616a"
	line-numbers-plus-style = "#a3be8c"
	line-numbers-zero-style = "#979da9"
	line-numbers-left-style = "#434c5e"
	line-numbers-right-style = "#434c5e"
