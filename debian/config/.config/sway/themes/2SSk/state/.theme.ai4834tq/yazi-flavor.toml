# Generated by theme_render.py (nord dark); edit the theme or this template, not the output.
# yazi's "desktop" flavor (theme yazi/theme.toml picks it), from the desktop theme's roles; file
# previews use the same colours through tmtheme.xml (the silicon.tmTheme render). Icons are yazi's
# own, in their own colours.

[mgr]
cwd = { fg = "#88c0d0" }
find_keyword = { fg = "#ebcb8b", bold = true, italic = true, underline = true }
find_position = { fg = "#d08770", bold = true, italic = true }
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_marked = { fg = "#81a1c1", bg = "#81a1c1" }
marker_selected = { fg = "#88c0d0", bg = "#88c0d0" }
count_copied = { fg = "#2e3440", bg = "#a3be8c" }
count_cut = { fg = "#2e3440", bg = "#bf616a" }
count_selected = { fg = "#2e3440", bg = "#88c0d0" }
border_symbol = "│"
border_style = { fg = "#434c5e" }

[indicator]
parent = { fg = "#d8dee9", bg = "#434c5e" }
current = { fg = "#2e3440", bg = "#88c0d0" }
preview = { fg = "#d8dee9", bg = "#434c5e" }

[status]
overall = { fg = "#d8dee9", bg = "#3b4252" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#d8dee9", bold = true }
progress_normal = { fg = "#88c0d0", bg = "#3b4252" }
progress_error = { fg = "#bf616a", bg = "#3b4252" }
perm_type = { fg = "#88c0d0" }
perm_read = { fg = "#ebcb8b" }
perm_write = { fg = "#bf616a" }
perm_exec = { fg = "#a3be8c" }
perm_sep = { fg = "#979da9" }

[mode]
normal_main = { fg = "#2e3440", bg = "#88c0d0", bold = true }
normal_alt = { fg = "#88c0d0", bg = "#3b4252" }
select_main = { fg = "#2e3440", bg = "#81a1c1", bold = true }
select_alt = { fg = "#81a1c1", bg = "#3b4252" }
unset_main = { fg = "#2e3440", bg = "#d08770", bold = true }
unset_alt = { fg = "#d08770", bg = "#3b4252" }

[tabs]
active = { fg = "#2e3440", bg = "#88c0d0", bold = true }
inactive = { fg = "#979da9", bg = "#3b4252" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border = { fg = "#88c0d0" }
title = { fg = "#d8dee9" }
value = { fg = "#d8dee9" }
selected = { bg = "#434c5e" }

[cmp]
border = { fg = "#88c0d0" }
active = { fg = "#2e3440", bg = "#88c0d0" }
inactive = { fg = "#d8dee9" }

[tasks]
border = { fg = "#88c0d0" }
title = { fg = "#d8dee9" }
hovered = { fg = "#88c0d0", underline = true }

[which]
cols = 3
mask = { bg = "#3b4252" }
cand = { fg = "#88c0d0" }
rest = { fg = "#979da9" }
desc = { fg = "#d8dee9" }
separator = " ▶ "
separator_style = { fg = "#979da9" }

[spot]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
tbl_col = { fg = "#d8dee9" }
tbl_cell = { fg = "#2e3440", bg = "#88c0d0" }

[help]
on = { fg = "#88c0d0" }
run = { fg = "#d8dee9" }
hovered = { bg = "#434c5e", bold = true }
footer = { fg = "#2e3440", bg = "#88c0d0" }

[notify]
title_info = { fg = "#a3be8c" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

[pick]
border = { fg = "#88c0d0" }
active = { fg = "#2e3440", bg = "#88c0d0" }
inactive = { fg = "#d8dee9" }

[confirm]
border = { fg = "#88c0d0" }
title = { fg = "#d8dee9" }
content = { fg = "#d8dee9" }
list = { fg = "#d8dee9" }
btn_yes = { fg = "#2e3440", bg = "#88c0d0" }
btn_no = { fg = "#d8dee9", bg = "#3b4252" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#d08770" },
	{ mime = "{audio,video}/*", fg = "#ebcb8b" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#81a1c1" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#a3be8c" },
	{ mime = "*", is = "orphan", fg = "#bf616a" },
	{ mime = "application/*exec*", fg = "#bf616a" },
	{ url = "*", fg = "#d8dee9" },
	{ url = "*/", fg = "#88c0d0" },
]
