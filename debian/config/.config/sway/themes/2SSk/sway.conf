# 2SSk: geometry and generated window colors; common apps/binds live above.
gaps inner 5
gaps outer 8
default_border pixel 1
default_floating_border pixel 1
include @@HOME@@/.config/sway/themes/2SSk/state/theme/i3.conf

# Settings is a dialog, not a tiled application.
for_window [app_id="^org.quickshell$" title="^Desktop settings$"] floating enable, border pixel 1, resize set 1100 740, move position center
