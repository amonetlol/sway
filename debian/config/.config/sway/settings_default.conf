# Shared behavior; visual settings belong to the selected theme.
set $mod Mod4
set $sway_root @@HOME@@/.config/sway
set $scripts @@HOME@@/.config/sway/scripts
set $terminal @@HOME@@/.local/bin/kitty
set $file_manager @@HOME@@/.local/bin/nautilus
font pango:Fira Sans Semi-Bold 11
floating_modifier $mod normal
focus_follows_mouse yes
focus_wrapping workspace
workspace_auto_back_and_forth yes
default_orientation horizontal
workspace_layout tabbed
output * scale 1
input type:keyboard {
    xkb_layout br
    xkb_model abnt2
    xkb_options ""
}
# No swayidle, idle timer, automatic lock or display power-off.
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_type="dialog"] floating enable
for_window [app_id="pavucontrol"] floating enable

# Keep the pointer visible; no idle-based cursor hiding.
seat * hide_cursor 0
