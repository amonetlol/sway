# MangoWM - binds do Arch (adaptadas de F:\GitHub\sway\endeavouros-niri/niri/binds.kdl; Mod = SUPER)
# Editável. O seletor de tema fica em SUPER+SHIFT+T. Super+F1/F mostram os atalhos.

bind=SUPER+ALT,R,reload_config
bind=CTRL+ALT,Delete,quit
bind=SUPER+SHIFT,E,quit

# Ajuda
bind=SUPER,F1,spawn,$HOME/.local/bin/show-hotkeys

# Apps
bind=SUPER,Return,spawn,kitty
bind=ALT,Return,spawn,kitty
bind=SUPER,W,spawn,firefox
bind=ALT,W,spawn,firefox
bind=SUPER,E,spawn,nautilus
bind=ALT,E,spawn,nautilus
bind=SUPER,D,spawn,rofi -show drun -no-sidebar-mode -theme $HOME/.config/rofi/themes/launcher-notabs.rasi
bind=ALT,D,spawn,rofi -show drun -no-sidebar-mode -theme $HOME/.config/rofi/themes/launcher-notabs.rasi
bind=SUPER+SHIFT,D,spawn,rofi -show drun
bind=SUPER,V,spawn,$HOME/.local/bin/clipboard-menu.sh
bind=SUPER,X,spawn,$HOME/.local/bin/power-menu.sh
bind=ALT,X,spawn,$HOME/.local/bin/power-menu.sh
bind=SUPER,M,spawn,$HOME/.local/bin/mon
bind=ALT,M,spawn,$HOME/.local/bin/mon
bind=SUPER+ALT,M,spawn,kitty -e btop
bind=SUPER+ALT,T,spawn,kitty -e btop
bind=SUPER+SHIFT,T,spawn,$HOME/.local/bin/theme-menu.sh
bind=SUPER,N,spawn,swaync-client -t -sw

# Wallpaper e layouts
bind=SUPER,F10,spawn,$HOME/.local/bin/rofi-wallpaper
bind=ALT,F10,spawn,$HOME/.local/bin/rofi-wallpaper
bind=SUPER,semicolon,spawn,$HOME/.local/bin/mango-layout-menu.sh

# Janelas
bind=SUPER,Q,killclient
bind=SUPER,F,togglemaximizescreen
bind=SUPER+ALT,F,togglefakefullscreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,T,togglefloating
bind=SUPER,C,centerwin
bind=SUPER,Tab,toggleoverview,1
bind=ALT,Tab,toggleoverview,0

# Foco (setas, WASD e HJKL)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,A,focusdir,left
bind=SUPER,S,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

# Mover janela
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,J,exchange_client,down

# Workspaces (tags)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,U,viewtoright,0
bind=SUPER,I,viewtoleft,0
bind=SUPER+CTRL,Down,tagtoright,0
bind=SUPER+CTRL,Up,tagtoleft,0
bind=SUPER+CTRL,U,tagtoright,0
bind=SUPER+CTRL,I,tagtoleft,0
bind=SUPER+SHIFT,Page_Down,tagtoright,0
bind=SUPER+SHIFT,Page_Up,tagtoleft,0

# Captura de tela
bind=none,Print,spawn,$HOME/.local/bin/screenshot.sh region
bind=CTRL,Print,spawn,$HOME/.local/bin/screenshot.sh full

# Audio e brilho
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft,0
axisbind=SUPER,DOWN,viewtoright,0
